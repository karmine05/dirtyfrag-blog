<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" style="max-width: 800px; height: auto;" role="img" aria-label="The ClickFix hunt loop: trigger resolves the host, four moves run in sequence, the verdict branches into labels, cohort hunt, volatile capture, and a paged OCSF timeline">
  <style>
    .stage     { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.5; fill: currentColor; fill-opacity: 0.05; }
    .trigger   { fill: #16213e; fill-opacity: 0.20; stroke: #0f3460; stroke-width: 1.5; }
    .move      { fill: #533483; fill-opacity: 0.15; stroke: #533483; stroke-width: 1.5; }
    .verdict   { fill: #e94560; fill-opacity: 0.18; stroke: #e94560; stroke-width: 2; }
    .safe      { font: 600 9.5px ui-sans-serif, system-ui, sans-serif; fill: #0f3460; text-transform: uppercase; letter-spacing: 0.06em; }
    .title     { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .subtitle  { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.6; }
    .stage-num { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.5; }
    .stage-lbl { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .stage-body{ font: 11px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.75; }
    .mono      { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.7; }
    .arrow     { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.8; fill: none; }
    .trust     { font: 600 9.5px ui-sans-serif, system-ui, sans-serif; fill: #533483; text-transform: uppercase; letter-spacing: 0.06em; }
    .danger    { font: 600 9.5px ui-sans-serif, system-ui, sans-serif; fill: #e94560; text-transform: uppercase; letter-spacing: 0.06em; }
  </style>

  <text x="20" y="28" class="title">The hunt, run as a loop</text>
  <text x="20" y="50" class="subtitle">One trigger in. Four moves. The verdict is a value in a column, so the harness can branch on it.</text>
  <text x="20" y="66" class="subtitle">Human in the loop only at the boundary you set.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
  </defs>

  <!-- Trigger -->
  <rect class="trigger" x="20" y="80" width="130" height="220"/>
  <text x="32" y="100" class="stage-num">T</text>
  <text x="85" y="100" text-anchor="middle" class="safe">On trigger</text>
  <text x="85" y="124" text-anchor="middle" class="stage-lbl">Trigger fires</text>
  <text x="85" y="148" text-anchor="middle" class="stage-body">IOC feed hit</text>
  <text x="85" y="162" text-anchor="middle" class="stage-body">DNS to lure domain</text>
  <text x="85" y="176" text-anchor="middle" class="stage-body">EDR alert</text>
  <text x="85" y="190" text-anchor="middle" class="stage-body">nightly sweep</text>
  <text x="85" y="220" text-anchor="middle" class="mono">resolve_host()</text>
  <text x="85" y="234" text-anchor="middle" class="mono">describe_table()</text>
  <text x="85" y="248" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">fuzzy name, serial,</text>
  <text x="85" y="262" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">user or IP</text>
  <text x="85" y="284" text-anchor="middle" class="stage-num">TRIGGER</text>

  <!-- Move 1 -->
  <rect class="move" x="164" y="80" width="130" height="220"/>
  <text x="176" y="100" class="stage-num">01</text>
  <text x="229" y="100" text-anchor="middle" class="trust">Browser</text>
  <text x="229" y="124" text-anchor="middle" class="stage-lbl">Visited or acted?</text>
  <text x="229" y="148" text-anchor="middle" class="stage-body">transition bitmask</text>
  <text x="229" y="162" text-anchor="middle" class="stage-body">decoded to a verdict</text>
  <text x="229" y="186" text-anchor="middle" class="mono">INTERACTED</text>
  <text x="229" y="200" text-anchor="middle" class="mono">ENGAGED</text>
  <text x="229" y="214" text-anchor="middle" class="mono">PASSIVE · VISITED</text>
  <text x="229" y="244" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">most triggers stop</text>
  <text x="229" y="258" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">here, cheaply</text>
  <text x="229" y="284" text-anchor="middle" class="stage-num">MOVE 1</text>

  <!-- Move 2 -->
  <rect class="move" x="308" y="80" width="130" height="220"/>
  <text x="320" y="100" class="stage-num">02</text>
  <text x="373" y="100" text-anchor="middle" class="trust">Filesystem</text>
  <text x="373" y="124" text-anchor="middle" class="stage-lbl">What landed</text>
  <text x="373" y="148" text-anchor="middle" class="stage-body">three sources fused:</text>
  <text x="373" y="172" text-anchor="middle" class="mono">quarantine</text>
  <text x="373" y="186" text-anchor="middle" class="mono">chrome downloads</text>
  <text x="373" y="200" text-anchor="middle" class="mono">fs scan</text>
  <text x="373" y="232" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">fs-only = arrived</text>
  <text x="373" y="246" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">outside the browser</text>
  <text x="373" y="284" text-anchor="middle" class="stage-num">MOVE 2</text>

  <!-- Move 3 -->
  <rect class="move" x="452" y="80" width="130" height="220"/>
  <text x="464" y="100" class="stage-num">03</text>
  <text x="517" y="100" text-anchor="middle" class="danger">Kernel</text>
  <text x="517" y="124" text-anchor="middle" class="stage-lbl">What executed</text>
  <text x="517" y="148" text-anchor="middle" class="stage-body">shell history joined</text>
  <text x="517" y="162" text-anchor="middle" class="stage-body">to users, classified</text>
  <text x="517" y="186" text-anchor="middle" class="mono">applescript_exec</text>
  <text x="517" y="200" text-anchor="middle" class="mono">piped_to_shell</text>
  <text x="517" y="214" text-anchor="middle" class="mono">persistence</text>
  <text x="517" y="246" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">ES events add lineage</text>
  <text x="517" y="284" text-anchor="middle" class="stage-num">MOVE 3</text>

  <!-- Verdict -->
  <rect class="verdict" x="596" y="80" width="184" height="220"/>
  <text x="608" y="100" class="stage-num">04</text>
  <text x="688" y="100" text-anchor="middle" class="danger">Verdict</text>
  <text x="688" y="124" text-anchor="middle" class="stage-lbl">Branch on the column</text>
  <text x="688" y="150" text-anchor="middle" class="mono">INTERACTED_ONLY:</text>
  <text x="688" y="164" text-anchor="middle" class="stage-body">add label · hunt cohort</text>
  <text x="688" y="190" text-anchor="middle" class="mono">EXECUTION_CONFIRMED:</text>
  <text x="688" y="204" text-anchor="middle" class="stage-body">collect volatile</text>
  <text x="688" y="218" text-anchor="middle" class="stage-body">emit OCSF · page human</text>
  <text x="688" y="248" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">labels and collection are</text>
  <text x="688" y="262" text-anchor="middle" class="stage-body" style="fill-opacity:0.55">additive; kills are one-way</text>
  <text x="688" y="284" text-anchor="middle" class="stage-num">MOVE 4</text>

  <!-- Arrows -->
  <path class="arrow" d="M 152 190 L 162 190" marker-end="url(#arr)"/>
  <path class="arrow" d="M 296 190 L 306 190" marker-end="url(#arr)"/>
  <path class="arrow" d="M 440 190 L 450 190" marker-end="url(#arr)"/>
  <path class="arrow" d="M 584 190 L 594 190" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="400" y="335" text-anchor="middle" class="subtitle">Most triggers exit after move 1. A confirmed hit labels the host and hunts the cohort that touched the lure domain,</text>
  <text x="400" y="350" text-anchor="middle" class="subtitle">then pages a human with a decoded, SIEM-ready timeline.</text>
  <text x="400" y="368" text-anchor="middle" class="subtitle">Escalate, don't decide: labels and collection run unattended; one-way actions hand off to whoever owns identity.</text>
</svg>
