<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" style="max-width: 800px; height: auto;" role="img" aria-label="SHADOW-EARTH-053 DLL sideload pairs — four legitimate signed binaries paired with malicious DLLs they unwittingly load">
  <style>
    .card       { fill: currentColor; fill-opacity: 0.04; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1.5; rx: 10; }
    .legit-box  { fill: #533483; fill-opacity: 0.14; stroke: #533483; stroke-width: 1.5; rx: 6; }
    .evil-box   { fill: #e94560; fill-opacity: 0.14; stroke: #e94560; stroke-width: 1.8; rx: 6; }
    .signer     { fill: currentColor; fill-opacity: 0.06; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1; rx: 12; }
    .title      { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .subtitle   { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.6; }
    .pair-label { font: 600 12.5px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .filename   { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; }
    .renamed    { font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.65; }
    .signer-txt { font: 10.5px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.65; }
    .hash       { font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.5; }
    .arrow      { stroke: #e94560; stroke-opacity: 0.7; stroke-width: 1.8; fill: none; }
    .badge-l    { font: 600 10px ui-sans-serif, system-ui, sans-serif; fill: #533483; text-transform: uppercase; letter-spacing: 0.06em; }
    .badge-e    { font: 600 10px ui-sans-serif, system-ui, sans-serif; fill: #e94560; text-transform: uppercase; letter-spacing: 0.06em; }
  </style>

  <text x="20" y="28" class="title">Four DLL-sideload pairs — trust abused, not broken</text>
  <text x="20" y="50" class="subtitle">Each row: a legitimate signed binary (left) unwittingly loads a co-located malicious DLL (right).</text>
  <text x="20" y="68" class="subtitle">Signing-cert verification passes; the trust placement is what's wrong.</text>

  <defs>
    <marker id="arr-evil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- Pair 1: GameHook.exe -->
  <rect class="card" x="20" y="90" width="760" height="100"/>
  <text x="38" y="114" class="badge-l">Signed loader</text>
  <rect class="legit-box" x="36" y="125" width="220" height="54"/>
  <text x="50" y="146" class="filename">GameHook.exe</text>
  <text x="50" y="161" class="renamed">renamed → runtimebroker.exe</text>
  <text x="50" y="174" class="renamed">(also seen as nvcontainer.exe)</text>

  <text x="290" y="114" class="badge-e">Malicious DLL</text>
  <rect class="evil-box" x="288" y="125" width="260" height="54"/>
  <text x="302" y="146" class="filename">graphics-hook-filter32.dll</text>
  <text x="302" y="161" class="hash">SHA-256: 4264cfb3…885f5c8</text>

  <path class="arrow" d="M 260 152 L 286 152" marker-end="url(#arr-evil)"/>

  <rect class="signer" x="570" y="116" width="200" height="68"/>
  <text x="670" y="135" text-anchor="middle" class="signer-txt">Authenticode signer</text>
  <text x="670" y="155" text-anchor="middle" class="pair-label">ORANGE VIEW</text>
  <text x="670" y="170" text-anchor="middle" class="pair-label">LIMITED</text>

  <!-- Pair 2: imecmnt.exe -->
  <rect class="card" x="20" y="200" width="760" height="100"/>
  <text x="38" y="224" class="badge-l">Signed loader</text>
  <rect class="legit-box" x="36" y="235" width="220" height="54"/>
  <text x="50" y="256" class="filename">imecmnt.exe</text>
  <text x="50" y="271" class="renamed">renamed → RuntimeBroker.exe</text>
  <text x="50" y="284" class="renamed">(also seen as osppsvc.exe)</text>

  <text x="290" y="224" class="badge-e">Malicious DLL</text>
  <rect class="evil-box" x="288" y="235" width="260" height="54"/>
  <text x="302" y="256" class="filename">imjp14k.dll</text>
  <text x="302" y="271" class="hash">SHA-256: 2e8f9fd8…81c04cd2</text>

  <path class="arrow" d="M 260 262 L 286 262" marker-end="url(#arr-evil)"/>

  <rect class="signer" x="570" y="226" width="200" height="68"/>
  <text x="670" y="245" text-anchor="middle" class="signer-txt">Authenticode signer</text>
  <text x="670" y="265" text-anchor="middle" class="pair-label">Microsoft</text>
  <text x="670" y="280" text-anchor="middle" class="pair-label">Corporation</text>

  <!-- Pair 3: xReport.exe -->
  <rect class="card" x="20" y="310" width="760" height="100"/>
  <text x="38" y="334" class="badge-l">Signed loader</text>
  <rect class="legit-box" x="36" y="345" width="220" height="54"/>
  <text x="50" y="366" class="filename">xReport.exe</text>
  <text x="50" y="381" class="renamed">used as-is</text>
  <text x="50" y="394" class="renamed">(no rename observed)</text>

  <text x="290" y="334" class="badge-e">Malicious DLL</text>
  <rect class="evil-box" x="288" y="345" width="260" height="54"/>
  <text x="302" y="366" class="filename">Uxtheme.dll</text>
  <text x="302" y="381" class="hash">SHA-256: 8d9433e9…4de733c78</text>

  <path class="arrow" d="M 260 372 L 286 372" marker-end="url(#arr-evil)"/>

  <rect class="signer" x="570" y="336" width="200" height="68"/>
  <text x="670" y="355" text-anchor="middle" class="signer-txt">Authenticode signer</text>
  <text x="670" y="375" text-anchor="middle" class="pair-label">Mainline Net</text>
  <text x="670" y="390" text-anchor="middle" class="pair-label">Holdings Ltd.</text>

  <!-- Pair 4: LUManager.EXE -->
  <rect class="card" x="20" y="420" width="760" height="100"/>
  <text x="38" y="444" class="badge-l">Signed loader</text>
  <rect class="legit-box" x="36" y="455" width="220" height="54"/>
  <text x="50" y="476" class="filename">LUManager.EXE</text>
  <text x="50" y="491" class="renamed">renamed → RAVCpl64.exe</text>

  <text x="290" y="444" class="badge-e">Malicious DLL</text>
  <rect class="evil-box" x="288" y="455" width="260" height="54"/>
  <text x="302" y="476" class="filename">MPS.dll</text>
  <text x="302" y="491" class="hash">SHA-256: d67197bf…65cf429b3</text>

  <path class="arrow" d="M 260 482 L 286 482" marker-end="url(#arr-evil)"/>

  <rect class="signer" x="570" y="446" width="200" height="68"/>
  <text x="670" y="465" text-anchor="middle" class="signer-txt">Authenticode signer</text>
  <text x="670" y="485" text-anchor="middle" class="pair-label">Samsung Electronics</text>
  <text x="670" y="500" text-anchor="middle" class="pair-label">CO., LTD.</text>

  <!-- Footer note -->
  <text x="400" y="546" text-anchor="middle" class="subtitle">Plus a Toshiba-signed binary renamed CIATosBtKbd.exe → sideloads TosBtKbd.dll → reads ShadowPad shellcode from a per-host registry value.</text>
</svg>
