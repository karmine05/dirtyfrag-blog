<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Hero: eMudhra CA key compromise. Eight CA keys guessable from day one. The same curl to a forged-certificate test host returns 200 before the fix and error 60 after.">
  <defs>
    <style>
      .bg      { fill: #0d1117; }
      .grid    { stroke: #1b2129; stroke-width: 1; }
      .kicker  { fill: #8b949e; font: 500 24px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 7px; }
      .h1      { fill: #f0f6fc; font: 700 54px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h1acc   { fill: #a78bfa; font: 700 54px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub     { fill: #8b949e; font: 400 23px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .q       { fill: #8b949e; font: 400 20px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .qacc    { fill: #f0f6fc; font: 600 20px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .res     { fill: #f0f6fc; font: 600 22px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .key     { fill: #8b949e; font: 400 14px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .statnum { fill: #f0f6fc; font: 700 46px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .statlbl { fill: #6e7681; font: 500 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .ok      { fill: #3fb950; }
      .bad     { fill: #f85149; }
      .foot    { fill: #6e7681; font: 400 20px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="675"/>
  <g class="grid">
    <line x1="0" y1="118" x2="1200" y2="118"/>
    <line x1="0" y1="588" x2="1200" y2="588"/>
    <line x1="812" y1="118" x2="812" y2="560"/>
  </g>

  <!-- LEFT: title block -->
  <text x="72" y="152" class="kicker">EMUDHRA CA KEY COMPROMISE</text>
  <text x="72" y="222" class="h1">8 CA keys,</text>
  <text x="72" y="286" class="h1"><tspan class="h1acc">guessable from day one</tspan></text>
  <text x="72" y="334" class="sub">Browsers blocked them in three days. Anything with its</text>
  <text x="72" y="366" class="sub">own copy of the trusted roots still believes them.</text>

  <!-- LEFT: stat row. Columns at 72 / 320 / 570, ~230px each -->
  <g>
    <text x="72"  y="470" class="statnum">&lt;256</text>
    <text x="72"  y="500" class="statlbl">private key value</text>

    <text x="320" y="470" class="statnum">16</text>
    <text x="320" y="500" class="statlbl">certs to distrust</text>

    <text x="570" y="470" class="statnum">9/24</text>
    <text x="570" y="500" class="statlbl">lab Linux unpatched</text>
  </g>

  <!-- RIGHT: the same curl, before and after. Column 856..1176 = 320px -->
  <g>
    <text x="856" y="166" class="key">same curl, one script apart</text>
    <text x="856" y="210" class="qacc">$ curl -sS https://</text>
    <text x="856" y="240" class="q">dv-g3b-emudhra.we-</text>
    <text x="856" y="270" class="q">have-a-problem.com</text>

    <circle cx="866" cy="322" r="7" class="bad"/>
    <text x="888" y="329" class="res">200  before</text>
    <circle cx="866" cy="368" r="7" class="ok"/>
    <text x="888" y="375" class="res">(60) after</text>
    <text x="888" y="402" class="key">SSL certificate problem</text>

    <rect x="856" y="470" width="300" height="1" fill="url(#glow)"/>
    <text x="856" y="506" class="key">browsers, OS stores: blocked</text>
    <text x="856" y="530" class="key">CA files, Node, certifi: open</text>
    <text x="856" y="554" class="key">fleetd certs.pem: open</text>
  </g>

  <!-- FOOTER: one mono line -->
  <text x="72" y="630" class="foot">detect: 3 Fleet queries &#183; fix: 3 Fleet scripts &#183; verify: one curl</text>
</svg>
