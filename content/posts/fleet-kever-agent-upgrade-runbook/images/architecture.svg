<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" style="max-width: 800px; height: auto;" role="img" aria-label="Architecture: local LLM agent connected to Fleet via MCP, querying 35 hosts, with the harness around it">
  <style>
    .box { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1.5; }
    .t { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .b { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; }
    .m { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.55; }
    .ar { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.5; fill: none; }
    .acc { fill: #6366f1; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="20" width="240" height="340" rx="10"/>
  <text x="140" y="48" text-anchor="middle" class="t">Agent harness</text>
  <rect class="acc" x="40" y="64" width="200" height="46" rx="6" fill-opacity="0.15"/>
  <text x="140" y="83" text-anchor="middle" class="b">local LLM (vLLM)</text>
  <text x="140" y="99" text-anchor="middle" class="m">4x A6000, no cloud calls</text>
  <text x="40" y="138" class="m">skills = runbooks, reusable</text>
  <text x="40" y="156" class="m">memory = facts with trust scores</text>
  <text x="40" y="174" class="m">secrets vault, never in chat</text>
  <text x="40" y="192" class="m">terminal + ssh + git</text>
  <text x="40" y="222" class="b">decides: read / verify /</text>
  <text x="40" y="240" class="b">act on green light only</text>
  <text x="40" y="286" class="m" fill-opacity="0.4">writes nothing to prod</text>
  <text x="40" y="304" class="m" fill-opacity="0.4">without explicit approval</text>

  <path class="ar" d="M 260 190 L 320 190" marker-end="url(#ah)"/>
  <text x="290" y="180" text-anchor="middle" class="m">MCP</text>

  <rect class="box" x="320" y="80" width="200" height="220" rx="10"/>
  <text x="420" y="108" text-anchor="middle" class="t">fleet-mcp</text>
  <text x="340" y="138" class="m">prepare_live_query</text>
  <text x="340" y="158" class="m">run_live_query</text>
  <text x="340" y="178" class="m">get_endpoints</text>
  <text x="340" y="198" class="m">get_aggregate_platforms</text>
  <text x="340" y="228" class="b">typed tools, one call</text>
  <text x="340" y="246" class="b">each, results mapped</text>
  <text x="340" y="264" class="b">per host</text>

  <path class="ar" d="M 520 100 L 580 100" marker-end="url(#ah)"/>
  <text x="550" y="90" text-anchor="middle" class="m">TLS :443</text>

  <rect class="box" x="580" y="40" width="200" height="120" rx="10"/>
  <text x="680" y="68" text-anchor="middle" class="t">Fleet 4.92.1</text>
  <text x="600" y="96" class="m">192.168.89.92</text>
  <text x="600" y="114" class="m">MySQL + Redis + nginx</text>
  <text x="600" y="132" class="m">orbit-managed osqueryd</text>
  <text x="600" y="150" class="m">policy + vuln engine</text>

  <rect class="box" x="580" y="200" width="200" height="160" rx="10"/>
  <text x="680" y="228" text-anchor="middle" class="t">35 hosts</text>
  <text x="600" y="258" class="b">25 linux (noble)</text>
  <text x="600" y="278" class="b">8 windows (lab)</text>
  <text x="600" y="298" class="b">2 macos</text>
  <text x="600" y="326" class="m">kernel 6.8.0-142 wave</text>
  <text x="600" y="344" class="m">+ 1 LXC on pve guest kernel</text>
</svg>