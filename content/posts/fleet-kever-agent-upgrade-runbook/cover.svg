<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Hero: One agent, one fleet, one reboot. 24 of 25 Linux hosts verified on the patched kernel.">
  <defs>
    <style>
      .bg      { fill: #0d1117; }
      .grid    { stroke: #1b2129; stroke-width: 1; }
      .kicker  { fill: #8b949e; font: 500 24px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 7px; }
      .h1      { fill: #f0f6fc; font: 700 54px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h1acc   { fill: #a78bfa; font: 700 54px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub     { fill: #8b949e; font: 400 23px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono    { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .q       { fill: #8b949e; font: 400 20px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .qacc    { fill: #f0f6fc; font: 600 20px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .res     { fill: #f0f6fc; font: 600 22px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .key     { fill: #8b949e; font: 400 14px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .statnum { fill: #f0f6fc; font: 700 46px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .statlbl { fill: #6e7681; font: 500 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .ok      { fill: #3fb950; }
      .warn    { fill: #d29922; }
      .foot    { fill: #6e7681; font: 400 20px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="675"/>
  <g class="grid">
    <line x1="0" y1="118" x2="1200" y2="118"/>
    <line x1="0" y1="588" x2="1200" y2="588"/>
    <line x1="812" y1="118" x2="812" y2="560"/>
  </g>

  <!-- LEFT: title block -->
  <text x="72" y="152" class="kicker">ONE AGENT. ONE FLEET. ONE REBOOT.</text>
  <text x="72" y="222" class="h1">24 of 25 verified</text>
  <text x="72" y="286" class="h1"><tspan class="h1acc">in the running kernel</tspan></text>
  <text x="72" y="334" class="sub">Installed is not running. The reboot is the</text>
  <text x="72" y="366" class="sub">mitigation; the kernel in memory is the evidence.</text>

  <!-- LEFT: stat row (live osquery results, 2026-09-27). Columns at 72 / 320 / 570, ~230px each -->
  <g>
    <text x="72"  y="470" class="statnum">24/25</text>
    <text x="72"  y="500" class="statlbl">on 6.8.0-142</text>

    <text x="320" y="470" class="statnum">23.6h</text>
    <text x="320" y="500" class="statlbl">uptime = reboot proof</text>

    <text x="570" y="470" class="statnum">2</text>
    <text x="570" y="500" class="statlbl">KEVs open, watchlisted</text>
  </g>

  <!-- RIGHT: the live query that proves it. Column 856..1176 = 320px: mono caps 26 chars @20px, 23 @22px, 42 @14px -->
  <g>
    <text x="856" y="166" class="key">kernel_info x uptime, 25/25 back</text>
    <text x="856" y="210" class="qacc">SELECT k.version,</text>
    <text x="856" y="240" class="qacc">u.total_seconds</text>
    <text x="856" y="270" class="q">FROM kernel_info k,</text>
    <text x="856" y="300" class="q">uptime u</text>

    <circle cx="866" cy="352" r="7" class="ok"/>
    <text x="888" y="359" class="res">6.8.0-142 x24</text>
    <circle cx="866" cy="398" r="7" class="warn"/>
    <text x="888" y="405" class="res">5.15-pve x1</text>
    <text x="888" y="432" class="key">ad-guard-home: LXC, scoped out</text>

    <rect x="856" y="470" width="300" height="1" fill="url(#glow)"/>
    <text x="856" y="506" class="key">Fleet 4.91.1 &#8594; 4.92.1</text>
    <text x="856" y="530" class="key">fleetctl 4.90.0 &#8594; 4.92.1</text>
    <text x="856" y="554" class="key">35 hosts: 25 ln / 8 win / 2 mac</text>
  </g>

  <!-- FOOTER: one mono line, ~70 chars @20px = 840px, fits 72..1176 -->
  <text x="72" y="630" class="foot">agent &#8594; fleet-mcp &#8594; Fleet &#8594; 35 hosts &#183; open by ceiling, close when the USN lands</text>
</svg>
