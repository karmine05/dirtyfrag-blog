<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="100%" style="max-width: 800px; height: auto; color: #e2e8f0;" role="img" aria-label="Windows per-OS scoping: one CIS control family fans out to a full Win11 profile, a stripped Win10 variant, a script path for Server, and a domain-join-gated LAPS profile; each branch is selected by labels">
  <style>
    .src   { fill: currentColor; fill-opacity: 0.05; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
    .cat   { fill: currentColor; fill-opacity: 0.04; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .c-v   { fill: #a78bfa; fill-opacity: 0.10; stroke: #a78bfa; stroke-width: 1.5; }
    .c-b   { fill: #60a5fa; fill-opacity: 0.10; stroke: #60a5fa; stroke-width: 1.5; }
    .c-o   { fill: #fb923c; fill-opacity: 0.10; stroke: #fb923c; stroke-width: 1.5; }
    .c-p   { fill: #e94560; fill-opacity: 0.10; stroke: #e94560; stroke-width: 1.5; }
    .g     { fill: #34d399; fill-opacity: 0.10; stroke: #34d399; stroke-width: 1.3; }
    .line  { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.3; fill: none; }
    .title { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .sub   { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.6; }
    .chip  { font: 11px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.85; }
    .mono  { font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.8; }
    .lab   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.55; }
    .acc-v { fill: #a78bfa; } .acc-b{ fill: #60a5fa; } .acc-o{ fill: #fb923c; } .acc-p{ fill: #e94560; } .acc-g{ fill: #34d399; }
  </style>

  <text x="20" y="22" class="title">Windows: one control family, four audiences</text>
  <text x="20" y="40" class="sub">the CSP surface differs by build and join state, so one control ships as label-gated variants</text>

  <!-- source -->
  <rect x="240" y="58" width="320" height="56" rx="8" class="src"/>
  <text x="256" y="80" class="chip" font-weight="600">ONE CIS CONTROL FAMILY</text>
  <text x="256" y="98" class="mono">firewall · user rights · spooler · LAPS</text>

  <path d="M280 114 V 140 M360 114 V 140 M440 114 V 140 M520 114 V 140" class="line"/>

  <!-- column 1: Win11 -->
  <rect x="16" y="146" width="182" height="240" rx="8" class="c-v"/>
  <circle cx="34" cy="166" r="4" class="acc-v"/>
  <text x="46" y="170" class="chip" font-weight="600">WIN 11 workstations</text>
  <rect x="30" y="182" width="154" height="24" rx="12" fill="none" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1"/>
  <text x="42" y="198" class="lab">build &gt;= 22000</text>
  <text x="30" y="228" class="chip">full profile,</text>
  <text x="30" y="244" class="chip">every CSP key included</text>
  <text x="30" y="266" class="mono">e.g. firewall profiles:</text>
  <text x="30" y="281" class="mono">every key incl. MdmStore</text>
  <text x="30" y="296" class="mono">logging, per profile</text>
  <rect x="30" y="330" width="154" height="40" rx="6" class="g"/>
  <text x="42" y="347" class="mono" fill="#34d399">100% verified</text>
  <text x="42" y="362" class="mono" fill="#34d399" fill-opacity="0.8">Win 11 host</text>

  <!-- column 2: Win10 -->
  <rect x="208" y="146" width="182" height="240" rx="8" class="c-b"/>
  <circle cx="226" cy="166" r="4" class="acc-b"/>
  <text x="238" y="170" class="chip" font-weight="600">WIN 10 workstations</text>
  <rect x="222" y="182" width="154" height="24" rx="12" fill="none" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1"/>
  <text x="234" y="198" class="lab">build &lt; 22000</text>
  <text x="222" y="228" class="chip">variant profile:</text>
  <text x="222" y="244" class="chip">keys this build lacks, out</text>
  <text x="222" y="266" class="mono">a handful of keys kept</text>
  <text x="222" y="281" class="mono">CIS-Win10-* variants</text>
  <text x="222" y="296" class="mono">in the team today</text>
  <rect x="222" y="330" width="154" height="40" rx="6" class="g"/>
  <text x="234" y="347" class="mono" fill="#34d399">100% verified</text>
  <text x="234" y="362" class="mono" fill="#34d399" fill-opacity="0.8">Win 10 hosts</text>

  <!-- column 3: Server -->
  <rect x="400" y="146" width="182" height="240" rx="8" class="c-o"/>
  <circle cx="418" cy="166" r="4" class="acc-o"/>
  <text x="430" y="170" class="chip" font-weight="600">WINDOWS SERVER</text>
  <rect x="414" y="182" width="154" height="24" rx="12" fill="none" stroke="#fb923c" stroke-opacity="0.6" stroke-width="1"/>
  <text x="426" y="198" class="lab">name = '%Server%'</text>
  <text x="414" y="228" class="chip">MDM enrollment</text>
  <text x="414" y="244" class="chip">unavailable by design</text>
  <text x="414" y="266" class="mono">policy checks run as</text>
  <text x="414" y="281" class="mono">osquery (no mdm_bridge),</text>
  <text x="414" y="296" class="mono">fixes via scripts / GPO</text>
  <rect x="414" y="330" width="154" height="40" rx="6" class="g"/>
  <text x="426" y="347" class="mono" fill="#34d399">every DC, by design</text>
  <text x="426" y="362" class="mono" fill="#34d399" fill-opacity="0.8">out of the MDM set</text>

  <!-- column 4: LAPS -->
  <rect x="592" y="146" width="192" height="240" rx="8" class="c-p"/>
  <circle cx="610" cy="166" r="4" class="acc-p"/>
  <text x="622" y="170" class="chip" font-weight="600">LAPS CONTROL</text>
  <rect x="606" y="182" width="164" height="24" rx="12" fill="none" stroke="#e94560" stroke-opacity="0.6" stroke-width="1"/>
  <text x="618" y="198" class="lab">label: domain-joined</text>
  <text x="606" y="228" class="chip">rotated admin password</text>
  <text x="606" y="244" class="chip">backs up to a directory</text>
  <text x="606" y="266" class="mono">AD or Entra required,</text>
  <text x="606" y="281" class="mono">enforced by the CSP</text>
  <text x="606" y="296" class="mono">workgroup hosts simply</text>
  <text x="606" y="311" class="mono">do not receive it</text>
  <rect x="606" y="330" width="164" height="40" rx="6" class="g"/>
  <text x="618" y="347" class="mono" fill="#34d399">works where it can</text>
  <text x="618" y="362" class="mono" fill="#34d399" fill-opacity="0.8">no cleanup after</text>

  <!-- bottom strip -->
  <rect x="16" y="404" width="768" height="30" rx="6" class="cat"/>
  <text x="32" y="423" class="mono">every profile label-gated · each host's set computed from its labels · per-build variants for Win 10</text>
</svg>
