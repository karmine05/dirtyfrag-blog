<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" style="max-width: 800px; height: auto; color: #e2e8f0;" role="img" aria-label="Label scoping flow: host attributes read by osquery feed dynamic label SQL queries, labels gate profiles and policies, and each host receives exactly the set its labels satisfy">
  <style>
    .card-v{ fill: #a78bfa; fill-opacity: 0.10; stroke: #a78bfa; stroke-width: 1.5; }
    .card-b{ fill: #60a5fa; fill-opacity: 0.10; stroke: #60a5fa; stroke-width: 1.5; }
    .scope { fill: #e94560; fill-opacity: 0.08; stroke: #e94560; stroke-width: 1.8; }
    .attr  { fill: currentColor; fill-opacity: 0.04; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .out   { fill: currentColor; fill-opacity: 0.03; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; }
    .line  { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.3; fill: none; }
    .title { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .sub   { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.6; }
    .chip  { font: 11px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.85; }
    .mono  { font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.8; }
    .lab   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.55; }
    .acc-v { fill: #a78bfa; } .acc-b{ fill: #60a5fa; } .acc-p{ fill: #e94560; }
  </style>

  <text x="20" y="22" class="title">Scope is a label, and a label is a query</text>
  <text x="20" y="40" class="sub">dynamic labels are osquery SQL, evaluated on a cycle. a host's set of profiles is the intersection of its labels</text>

  <!-- attributes row -->
  <text x="20" y="66" class="lab">HOST ATTRIBUTES — READ LIVE</text>
  <rect x="20" y="76" width="150" height="40" rx="6" class="attr"/>
  <text x="32" y="92" class="chip" font-weight="600">os_version</text>
  <text x="32" y="107" class="mono">build 19045 · 26200</text>
  <rect x="182" y="76" width="150" height="40" rx="6" class="attr"/>
  <text x="194" y="92" class="chip" font-weight="600">SKU</text>
  <text x="194" y="107" class="mono">Pro · Server 2022</text>
  <rect x="344" y="76" width="150" height="40" rx="6" class="attr"/>
  <text x="356" y="92" class="chip" font-weight="600">enrollment</text>
  <text x="356" y="107" class="mono">ProviderID = Fleet</text>
  <rect x="506" y="76" width="130" height="40" rx="6" class="attr"/>
  <text x="518" y="92" class="chip" font-weight="600">domain</text>
  <text x="518" y="107" class="mono">Tcpip Domain key</text>
  <rect x="648" y="76" width="132" height="40" rx="6" class="attr"/>
  <text x="660" y="92" class="chip" font-weight="600">MDM state</text>
  <text x="660" y="107" class="mono">mdm.enrolled</text>

  <path d="M400 116 V 140" class="line"/>

  <!-- two label cards -->
  <rect x="20" y="146" width="380" height="86" rx="8" class="card-v"/>
  <circle cx="38" cy="164" r="4" class="acc-v"/>
  <text x="50" y="168" class="chip" font-weight="600">CIS scope - Windows 11 workstations</text>
  <text x="36" y="190" class="mono">SELECT 1 FROM os_version</text>
  <text x="36" y="206" class="mono">WHERE platform='windows' AND name NOT LIKE '%Server%'</text>
  <text x="36" y="222" class="mono">AND CAST(build AS INTEGER) &gt;= 22000;</text>

  <rect x="420" y="146" width="360" height="86" rx="8" class="card-b"/>
  <circle cx="438" cy="164" r="4" class="acc-b"/>
  <text x="450" y="168" class="chip" font-weight="600">CIS scope - macOS MDM enrolled</text>
  <text x="436" y="190" class="mono">SELECT 1 FROM mdm</text>
  <text x="436" y="206" class="mono">WHERE enrolled = 'true';</text>
  <text x="436" y="222" class="mono">-- same pattern gates Windows MDM: ProviderID='Fleet'</text>

  <path d="M210 232 V 262 M600 232 V 262" class="line"/>

  <!-- label chips row -->
  <text x="20" y="278" class="lab">19 REPO LABELS + LIVE ONES → 50 IN THE SERVER</text>
  <rect x="20" y="288" width="760" height="34" rx="17" class="out"/>
  <text x="40" y="309" class="chip">Win11 WS · Win10 WS · Server all · member servers · MDM-enrolled · domain-joined · Enterprise/Edu · TPM ready · macOS MDM · …</text>

  <path d="M400 322 V 344" class="line"/>

  <!-- scope box -->
  <rect x="20" y="350" width="760" height="84" rx="8" class="scope"/>
  <text x="40" y="374" class="chip" font-weight="600">SCOPE = AND OF LABEL REQUIREMENTS — each profile and policy carries its label set</text>
  <text x="40" y="396" class="mono">Win11 host  →  full benchmark, 231 profiles verified     Win10 host  →  variant set, 205 verified</text>
  <text x="40" y="414" class="mono">macOS host  →  MDM profiles + 119 CIS macOS policies       Ubuntu DMZ  →  187 STIG policies + scripts, no MDM</text>
  <text x="40" y="430" class="sub">a new host is enrolled and auto-scoped on its first check-in; a build or join-state change re-scopes it. nothing is tuned per host.</text>
</svg>
