<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="100%" style="max-width: 800px; height: auto; color: #e2e8f0;" role="img" aria-label="Fleet architecture: Windows, macOS and Ubuntu hosts with one osquery agent each, MDM channels for Windows and macOS, all feeding one Fleet server">
  <style>
    .win  { fill: #a78bfa; fill-opacity: 0.10; stroke: #a78bfa; stroke-width: 1.5; }
    .mac  { fill: #60a5fa; fill-opacity: 0.10; stroke: #60a5fa; stroke-width: 1.5; }
    .lnx  { fill: #fb923c; fill-opacity: 0.10; stroke: #fb923c; stroke-width: 1.5; }
    .srv  { fill: #e94560; fill-opacity: 0.06; stroke: #e94560; stroke-width: 1.8; }
    .layer{ fill: currentColor; fill-opacity: 0.03; stroke: currentColor; stroke-opacity: 0.30; stroke-width: 1; }
    .line { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.3; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .title{ font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .sub  { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.6; }
    .chip { font: 11px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.85; }
    .mono { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.75; }
    .lab  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.6; }
    .acc-v{ fill: #a78bfa; } .acc-b{ fill: #60a5fa; } .acc-o{ fill: #fb923c; } .acc-p{ fill: #e94560; }
  </style>

  <text x="20" y="22" class="title">One server, three operating systems</text>
  <text x="20" y="40" class="sub">every host runs one osquery agent; MDM rides the same server where the OS supports it</text>

  <!-- Windows island -->
  <rect x="20" y="58" width="290" height="104" rx="8" class="win"/>
  <circle cx="38" cy="76" r="4" class="acc-v"/>
  <text x="50" y="80" class="chip" font-weight="600">WINDOWS · 7 hosts</text>
  <text x="38" y="100" class="chip">Windows 10 Pro 22H2 ×2   (domain-joined + workgroup)</text>
  <text x="38" y="118" class="chip">Windows 11 Pro ×2   (25H2 + 26H2, domain-joined)</text>
  <text x="38" y="136" class="chip">Windows Server 2022 ×3   (domain controllers)</text>
  <text x="38" y="154" class="mono">agent + mdm_bridge where client-OS</text>

  <!-- macOS island -->
  <rect x="20" y="178" width="290" height="86" rx="8" class="mac"/>
  <circle cx="38" cy="196" r="4" class="acc-b"/>
  <text x="50" y="200" class="chip" font-weight="600">macOS · 2 hosts</text>
  <text x="38" y="220" class="chip">MacBook Pro  · macOS 27.2  · MDM enrolled (Fleet)</text>
  <text x="38" y="238" class="chip">Mac mini       · macOS 27.2  · agent only</text>
  <text x="38" y="256" class="mono">Apple MDM channel + declarative mgmt</text>

  <!-- Ubuntu island -->
  <rect x="20" y="280" width="290" height="112" rx="8" class="lnx"/>
  <circle cx="38" cy="298" r="4" class="acc-o"/>
  <text x="50" y="302" class="chip" font-weight="600">UBUNTU · 25 hosts · DMZ</text>
  <text x="38" y="322" class="chip">docker swarm  · 3 managers + 7 workers (26.04)</text>
  <text x="38" y="340" class="chip">Wazuh indexers ×8  ·  masters + data nodes (24.04)</text>
  <text x="38" y="358" class="chip">AdGuard Home · load balancer · Fleet server itself</text>
  <text x="38" y="378" class="mono">no MDM on Linux — osquery + scripts + policies</text>

  <!-- channels -->
  <path d="M310 110 H 372" class="line"/>
  <path d="M310 221 H 372" class="line dash"/>
  <path d="M310 336 H 372" class="line dash"/>
  <text x="316" y="103" class="lab">osquery + WSTEP</text>
  <text x="316" y="214" class="lab">osquery + Apple MDM</text>
  <text x="316" y="329" class="lab">osquery</text>

  <!-- server -->
  <rect x="380" y="58" width="400" height="334" rx="10" class="srv"/>
  <text x="400" y="84" class="title">Fleet server</text>
  <text x="400" y="102" class="sub">one control plane · https · API + MDM endpoints on the same host</text>

  <rect x="400" y="118" width="360" height="52" rx="6" class="layer"/>
  <text x="414" y="138" class="chip" font-weight="600">CONSOLE &amp; API</text>
  <text x="414" y="156" class="mono">web UI · REST API · fleetctl · fleet-mcp (agent tool catalog)</text>

  <rect x="400" y="182" width="360" height="66" rx="6" class="layer"/>
  <text x="414" y="202" class="chip" font-weight="600">OSQUERY LAYER</text>
  <text x="414" y="220" class="mono">live queries · 919 policies (pass/fail per host) · 14 scripts</text>
  <text x="414" y="238" class="mono">scheduled packs · software inventory · 50 labels, mostly dynamic</text>

  <rect x="400" y="260" width="360" height="66" rx="6" class="layer"/>
  <text x="414" y="280" class="chip" font-weight="600">MDM LAYER</text>
  <text x="414" y="298" class="mono">Windows: mdm_bridge over WSTEP · 423 CSP profiles in the team</text>
  <text x="414" y="316" class="mono">macOS: Apple MDM · profiles + declarations · root CA</text>

  <rect x="400" y="338" width="360" height="38" rx="6" class="layer"/>
  <text x="414" y="361" class="mono">SCOPE: profiles and policies carry label requirements — hosts match, they get it</text>

  <text x="380" y="416" class="sub">label evaluation runs on a cycle · a host's profile set is recomputed from its labels, never tuned per host</text>
</svg>
