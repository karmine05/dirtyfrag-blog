<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" style="max-width: 800px; height: auto; color: #e2e8f0;" role="img" aria-label="Remediation ladder: a policy checks one setting with SQL; on fail the fix is a CSP profile where MDM can write it, otherwise a check-and-apply script; catalog.csv names the fix for every policy">
  <style>
    .pol   { fill: #a78bfa; fill-opacity: 0.12; stroke: #a78bfa; stroke-width: 1.8; }
    .ok    { fill: #34d399; fill-opacity: 0.10; stroke: #34d399; stroke-width: 1.5; }
    .l1    { fill: #60a5fa; fill-opacity: 0.10; stroke: #60a5fa; stroke-width: 1.5; }
    .l2    { fill: #fb923c; fill-opacity: 0.10; stroke: #fb923c; stroke-width: 1.5; }
    .cat   { fill: currentColor; fill-opacity: 0.04; stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .branch{ fill: currentColor; fill-opacity: 0.03; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; }
    .line  { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.3; fill: none; }
    .title { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .sub   { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.6; }
    .chip  { font: 11px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.85; }
    .mono  { font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.8; }
    .lab   { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.55; }
    .acc-v { fill: #a78bfa; } .acc-g{ fill: #34d399; } .acc-b{ fill: #60a5fa; } .acc-o{ fill: #fb923c; }
  </style>

  <text x="20" y="22" class="title">One policy, the right kind of fix</text>
  <text x="20" y="40" class="sub">every control is a SQL check first; the fix follows what the OS supports</text>

  <!-- policy -->
  <rect x="250" y="58" width="300" height="64" rx="8" class="pol"/>
  <circle cx="270" cy="78" r="4" class="acc-v"/>
  <text x="282" y="82" class="chip" font-weight="600">POLICY · always-on SQL check</text>
  <text x="266" y="102" class="mono">one setting per policy · pass / fail per host</text>
  <text x="266" y="116" class="mono">763 CIS in the repo · 919 live in the server</text>

  <path d="M400 122 V 146" class="line"/>
  <!-- decision -->
  <polygon points="400,146 470,178 400,210 330,178" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.3"/>
  <text x="400" y="182" class="chip" text-anchor="middle">pass?</text>

  <path d="M470 178 H 560" class="line"/>
  <rect x="560" y="152" width="220" height="52" rx="8" class="ok"/>
  <circle cx="578" cy="170" r="4" class="acc-g"/>
  <text x="590" y="174" class="chip" font-weight="600">compliant</text>
  <text x="576" y="192" class="mono">nothing happens, no writes</text>

  <path d="M400 210 V 232" class="line"/>
  <text x="408" y="226" class="lab">fail → remediation ladder</text>

  <!-- ladder step 1 -->
  <rect x="30" y="238" width="370" height="64" rx="8" class="l1"/>
  <circle cx="48" cy="258" r="4" class="acc-b"/>
  <text x="60" y="262" class="chip" font-weight="600">1 · CSP profile: MDM writes the setting</text>
  <text x="46" y="282" class="mono">Windows CSP XML · macOS .mobileconfig</text>
  <text x="46" y="296" class="mono">320 Windows + 15 macOS profiles, same labels</text>

  <path d="M215 302 V 322" class="line"/>
  <text x="225" y="318" class="lab">no CSP key on this build?</text>

  <!-- ladder step 2 -->
  <rect x="30" y="326" width="370" height="64" rx="8" class="l2"/>
  <circle cx="48" cy="346" r="4" class="acc-o"/>
  <text x="60" y="350" class="chip" font-weight="600">2 · script: check by default, apply on demand</text>
  <text x="46" y="370" class="mono">DEFAULT_MODE=--check → exit 0 = compliant</text>
  <text x="46" y="384" class="mono">98 Windows · 40 macOS · 158 Ubuntu scripts</text>

  <!-- per-OS branch column -->
  <rect x="440" y="238" width="340" height="152" rx="8" class="branch"/>
  <text x="456" y="260" class="chip" font-weight="600">THE LADDER, PER OS</text>
  <text x="456" y="282" class="mono">Windows · profile-first, script where no CSP</text>
  <text x="456" y="300" class="mono">macOS · MDM profiles + scripts</text>
  <text x="456" y="318" class="mono">Ubuntu · policies + scripts, MDM channel off</text>
  <text x="456" y="336" class="mono">Server · no MDM by design: scripts + GPO</text>
  <text x="456" y="354" class="mono">    the ladder is a property of the OS,</text>
  <text x="456" y="372" class="mono">    encoded once in the repo</text>

  <!-- catalog strip -->
  <rect x="30" y="404" width="750" height="28" rx="6" class="cat"/>
  <text x="46" y="422" class="mono">catalog.csv: one row per policy · csp_uri · profile_file · script_file · scope_label · scope_reason</text>
</svg>
