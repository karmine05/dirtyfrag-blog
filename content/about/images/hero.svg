<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="About: Dhruv Majumdar, VP of Security Solutions. Twenty years across MxDR, VMDR, CTI and red teaming, now building the auditable AI layer of security operations: fleet-mcp, agentic-detector, and agent-assisted hunting.">
  <rect width="1200" height="675" fill="#0d1117"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- hairlines -->
    <line x1="0" y1="115" x2="1200" y2="115" stroke="#21262d" stroke-width="1"/>
    <line x1="0" y1="587" x2="1200" y2="587" stroke="#21262d" stroke-width="1"/>
    <line x1="800" y1="115" x2="800" y2="587" stroke="#21262d" stroke-width="1"/>

    <!-- kicker -->
    <text x="72" y="163" font-size="18" letter-spacing="4" fill="#8b949e" font-weight="600">ABOUT · KARMINE'S NOTES</text>

    <!-- name + title -->
    <text x="72" y="238" font-size="54" font-weight="800" fill="#f0f6fc">Dhruv Majumdar</text>
    <text x="72" y="288" font-size="28" font-weight="700" fill="#a78bfa">VP of Security Solutions</text>

    <!-- dek -->
    <text x="72" y="342" font-size="19" fill="#8b949e">Two decades across MxDR, VMDR, CTI and red teaming.</text>
    <text x="72" y="368" font-size="19" fill="#8b949e">Now the operators are human and agent — and the work stays auditable.</text>

    <!-- stats row -->
    <g>
      <text x="72" y="508" font-size="36" font-weight="800" fill="#f0f6fc">20+</text>
      <text x="72" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b949e">years in security</text>
      <text x="264" y="508" font-size="36" font-weight="800" fill="#f0f6fc">3</text>
      <text x="264" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b949e">OS, one control plane</text>
      <text x="456" y="508" font-size="36" font-weight="800" fill="#f0f6fc">2</text>
      <text x="456" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b949e">tools built for agents</text>
      <text x="648" y="508" font-size="36" font-weight="800" fill="#34d399">100%</text>
      <text x="648" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b949e">SQL stays visible</text>
    </g>

    <!-- right panel cards -->
    <g>
      <!-- OPERATE -->
      <rect x="828" y="136" width="312" height="96" rx="12" fill="#161b22" stroke="#7c5cd6" stroke-width="1"/>
      <text x="848" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#a78bfa">OPERATE</text>
      <text x="1120" y="176" text-anchor="end" font-size="19" font-weight="700" fill="#f0f6fc">fleet-mcp</text>
      <text x="1120" y="199" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">see the SQL · real scans out</text>
      <!-- HUNT -->
      <rect x="828" y="246" width="312" height="96" rx="12" fill="#161b22" stroke="#3b6fd4" stroke-width="1"/>
      <text x="848" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#60a5fa">HUNT</text>
      <text x="1120" y="286" text-anchor="end" font-size="19" font-weight="700" fill="#f0f6fc">vibe hunting</text>
      <text x="1120" y="309" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">agent SQL · OCSF · verdict</text>
      <!-- SEE -->
      <rect x="828" y="356" width="312" height="96" rx="12" fill="#161b22" stroke="#c2620f" stroke-width="1"/>
      <text x="848" y="396" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#fb923c">SEE</text>
      <text x="1120" y="396" text-anchor="end" font-size="19" font-weight="700" fill="#f0f6fc">agentic-detector</text>
      <text x="1120" y="419" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">the AI layer, queryable</text>
      <!-- SPEAK -->
      <rect x="828" y="466" width="312" height="96" rx="12" fill="#161b22" stroke="#c2417f" stroke-width="1"/>
      <text x="848" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#e94560">SPEAK</text>
      <text x="1120" y="506" text-anchor="end" font-size="19" font-weight="700" fill="#f0f6fc">BSides · DC416</text>
      <text x="1120" y="529" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">conINT · HacKP · podcasts</text>
      <line x1="828" y1="574" x2="1140" y2="574" stroke="#a78bfa" stroke-width="2"/>
    </g>

    <!-- footer -->
    <text x="72" y="640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">labels decide scope · agents do the work · humans keep the wheel</text>
    <text x="1128" y="640" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">karmines notes</text>
  </g>
</svg>
