command_line_flags:
  verbose: false
  events_max: 250000
  events_expiry: 86400
  logger_plugin: tls
  disable_events: false
  watchdog_delay: 120
  disable_watchdog: true
  enable_bpf_events: true
  enable_file_events: true
  watchdog_memory_limit: 600
  watchdog_latency_limit: 0
  windows_event_channels: Security,Application,System,Microsoft-Windows-PowerShell/Operational
  disable_endpointsecurity: false
  enable_dns_lookup_events: true
  yara_sigurl_authenticate: false
  enable_process_etw_events: true
  watchdog_utilization_limit: 130
  enable_ntfs_event_publisher: true
  disable_endpointsecurity_fim: false
  enable_windows_events_publisher: true
  enable_windows_events_subscriber: true
  enable_powershell_events_subscriber: true
